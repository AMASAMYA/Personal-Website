[build]
  command = "npm install && node build.js"
  publish = "."

[functions]
  directory = "netlify/functions"

# Redirect old admin.html to renamed library-admin page
[[redirects]]
  from = "/admin.html"
  to = "/library-admin.html"
  status = 301

# AMASAMYA apex & www domain - root path serves the dedicated AMASAMYA platform homepage
[[redirects]]
  from = "https://amasamya.com/"
  to = "/amasamya-home.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.amasamya.com/"
  to = "/amasamya-home.html"
  status = 200
  force = true

[[redirects]]
  from = "http://amasamya.com/"
  to = "/amasamya-home.html"
  status = 200
  force = true

[[redirects]]
  from = "http://www.amasamya.com/"
  to = "/amasamya-home.html"
  status = 200
  force = true

# Clean URL aliases
[[redirects]]
  from = "/checker"
  to = "/checker.html"
  status = 200

[[redirects]]
  from = "/extension"
  to = "/amasamya.html"
  status = 200

[[redirects]]
  from = "/nvda-addon"
  to = "/nvda-addon.html"
  status = 200

[[redirects]]
  from = "/doc-checker"
  to = "/doc-checker.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

# Academy routes retired on 2026-09-15 (programme scope narrowed to
# product-only). The old /academy, /apply, /academy-admin, and /author
# paths now permanently redirect to the AMASAMYA product home so that
# any inbound link from posts, listings, or shared bookmarks still
# lands on a live page instead of a 404.
[[redirects]]
  from = "/academy"
  to = "/"
  status = 301

[[redirects]]
  from = "/apply"
  to = "/"
  status = 301

[[redirects]]
  from = "/academy-admin"
  to = "/"
  status = 301

[[redirects]]
  from = "/author"
  to = "/"
  status = 301

# platform.amasamya.com - canonical home for the audit platform.
# Root path serves the public landing page; auth-walled app at /index.html
# is still reachable via the wildcard rewrite below. Order matters: specific
# paths must precede the wildcard.
[[redirects]]
  from = "https://platform.amasamya.com/"
  to = "/amasamya/landing.html"
  status = 200
  force = true

[[redirects]]
  from = "https://platform.amasamya.com/credits"
  to = "/amasamya/credits.html"
  status = 200
  force = true

# Old subdomain permanently redirects to the canonical platform domain.
# Keep amasamya.akhileshmalani.com as a custom domain on the Netlify site
# so Netlify can serve these 301s; do not remove it from the domain list.
[[redirects]]
  from = "https://amasamya.akhileshmalani.com/"
  to = "https://platform.amasamya.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://amasamya.akhileshmalani.com/credits"
  to = "https://platform.amasamya.com/credits"
  status = 301
  force = true

# AMASAMYA apex domain web app platform routes
[[redirects]]
  from = "https://amasamya.com/app"
  to = "/amasamya/index.html"
  status = 200

[[redirects]]
  from = "https://www.amasamya.com/app"
  to = "/amasamya/index.html"
  status = 200

[[redirects]]
  from = "https://amasamya.com/app/*"
  to = "/amasamya/:splat"
  status = 200

[[redirects]]
  from = "https://www.amasamya.com/app/*"
  to = "/amasamya/:splat"
  status = 200

# platform.amasamya.com wildcard - every other path serves /amasamya/ content
[[redirects]]
  from = "https://platform.amasamya.com/*"
  to = "/amasamya/:splat"
  status = 200
  force = true

# Old subdomain wildcard - redirect everything else to the new domain
[[redirects]]
  from = "https://amasamya.akhileshmalani.com/*"
  to = "https://platform.amasamya.com/:splat"
  status = 301
  force = true

# Redirect old /ama11y/ paths on apex domain to new /amasamya/ paths (backward compat).
# Netlify path matching is case-sensitive, so add the common uppercase variants
# explicitly - Chrome Web Store listings created during the AMA11Y branding era
# may reference /AMA11Y/ with capitals and would otherwise 404.
[[redirects]]
  from = "/ama11y/*"
  to = "/amasamya/:splat"
  status = 301
[[redirects]]
  from = "/AMA11Y/*"
  to = "/amasamya/:splat"
  status = 301
[[redirects]]
  from = "/Ama11y/*"
  to = "/amasamya/:splat"
  status = 301

# Privacy-policy aliases - Chrome Web Store / Firefox / Edge reviewers (and
# anyone else) get a direct 200 from any sensible URL. Avoids the "policy
# link broken/unavailable" enforcement (Purple Nickel) when a stale listing
# URL targets one of these paths.
[[redirects]]
  from = "/privacy"
  to = "/amasamya/privacy.html"
  status = 200
[[redirects]]
  from = "/privacy.html"
  to = "/amasamya/privacy.html"
  status = 200
[[redirects]]
  from = "/ama11y/privacy"
  to = "/amasamya/privacy.html"
  status = 200
[[redirects]]
  from = "/amasamya/privacy"
  to = "/amasamya/privacy.html"
  status = 200

# Redirect old orphaned bookmarklet installer URLs to the AMASAMYA
# landing page. The /amasamya/install.html target referenced previously
# never existed on the live site, so these 301s would chain into 404s
# and waste Google crawl budget.
[[redirects]]
  from = "/AMASAMYA_Bookmarklet_Installer.html"
  to = "/amasamya/landing.html"
  status = 301

[[redirects]]
  from = "/AMA11Y_Bookmarklet_Installer.html"
  to = "/amasamya/landing.html"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets (images, fonts, icons)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS and JS (1 week - content may change on deploy)
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML pages - revalidate on every request, but allow the browser to
# serve from cache when the ETag matches (Netlify sets a strong ETag
# automatically). `no-cache` does NOT mean "do not cache" - it means
# "revalidate before reuse". This gives a fast 304-Not-Modified path
# on unchanged deploys instead of always re-downloading the full page,
# while still guaranteeing freshness when the deploy changes.
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, no-cache"

# NVDA add-on files are ZIP archives with a .nvda-addon extension.
# Netlify does not know this type by default. Serve as octet-stream
# with Content-Disposition: attachment so browsers download rather
# than try to open or display the file.
[[headers]]
  for = "*.nvda-addon"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=604800"
