# NVDA add-on manifest for AMASAMYA.
#
# Values here are read by NVDA at install time. Keep this file in
# sync with buildVars.py; the SCons template reads buildVars.py and
# writes a derived manifest at build time, but a hand-shipped
# .nvda-addon ZIP relies on this file verbatim.

name = amasamya
summary = AMASAMYA Accessibility Audit Companion
description = Companion scripts for the AMASAMYA accessibility audit extensions on Chrome, Microsoft Edge, and Firefox. Five keyboard shortcuts: NVDA+Shift+A finds the AMASAMYA panel on the current browser tab, NVDA+Shift+N and NVDA+Shift+P walk between failures in the findings table, NVDA+Shift+F reads the current finding's fix, NVDA+Shift+U speaks the audit summary. All output goes to speech and Braille. Built by Akhilesh Malani, a blind accessibility engineer, in personal capacity.
author = Akhilesh Malani <akhilesh.malani@gmail.com>
url = https://amasamya.com
docFileName = readme.html
version = 0.2.0

# NVDA versions this add-on is tested against. minimumNVDAVersion is
# the oldest NVDA release that will accept the install. lastTestedNVDAVersion
# is the newest release Akhilesh has run it on. Both use YYYY.N or
# YYYY.N.N format per NVDA convention.
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2024.4
